<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Brand style tile template</title>
  <desc id="desc">A labelled layout for a logo, colour palette, typography, image direction and message.</desc>
  <rect width="1600" height="1000" fill="#f4f0e8"/>
  <rect x="64" y="64" width="1472" height="872" rx="28" fill="#ffffff" stroke="#14213d" stroke-width="4"/>
  <text x="112" y="142" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#14213d">BRAND STYLE TILE · REPLACE ALL PLACEHOLDER TEXT</text>
  <text x="112" y="194" font-family="Arial, sans-serif" font-size="24" fill="#475569">Client · audience · one-sentence promise</text>
  <rect x="112" y="250" width="510" height="275" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="148" y="305" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14213d">01 · LOGO / WORDMARK</text>
  <text x="148" y="410" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#64748b">YOUR MARK HERE</text>
  <rect x="664" y="250" width="824" height="275" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="700" y="305" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14213d">02 · COLOUR SYSTEM</text>
  <rect x="700" y="350" width="160" height="110" rx="12" fill="#14213d"/>
  <rect x="890" y="350" width="160" height="110" rx="12" fill="#fca311"/>
  <rect x="1080" y="350" width="160" height="110" rx="12" fill="#e5e7eb"/>
  <rect x="1270" y="350" width="160" height="110" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="492" font-family="Arial, sans-serif" font-size="20" fill="#475569">Add HEX values and the role of each colour.</text>
  <rect x="112" y="565" width="650" height="300" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="148" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14213d">03 · TYPE HIERARCHY</text>
  <text x="148" y="700" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#14213d">Headline sample</text>
  <text x="148" y="752" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#475569">Subheading sample</text>
  <text x="148" y="806" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Body copy: readable at its final size.</text>
  <rect x="804" y="565" width="684" height="300" rx="18" fill="#14213d"/>
  <text x="840" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">04 · MESSAGE + IMAGE DIRECTION</text>
  <text x="840" y="700" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#fca311">YOUR REQUIRED LINE</text>
  <text x="840" y="755" font-family="Arial, sans-serif" font-size="22" fill="#e5e7eb">Describe crop, mood, and what the viewer notices first.</text>
  <text x="112" y="912" font-family="Arial, sans-serif" font-size="19" fill="#64748b">Checkpoint: every choice must serve the named audience and message.</text>
</svg>
